name: Classtago Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create .env.mobile from secrets
        run: |
          cat > src/.env.mobile << ENVEOF
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_EDUNIXO_API_BASE_URL=${{ secrets.VITE_EDUNIXO_API_BASE_URL }}
          ENVEOF
          echo "--- .env.mobile created (values hidden) ---"
          wc -l src/.env.mobile

      - name: Build mobile web app
        run: npm run build:mobile
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure Android SDK env
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV

      - name: Sync Capacitor Android
        run: cd src && npx cap sync android

      - name: Build Debug APK
        run: cd src/android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: classtago-debug-apk
          path: src/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
