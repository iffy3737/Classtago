name: Classtago Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build mobile web app
        run: npm run build:mobile
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: cd src && npx cap sync android

      - name: Build Debug APK
        run: cd src/android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: classtago-debug-apk
          path: src/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
